name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Write-Host "Downloading FFmpeg..."
          Invoke-WebRequest -Uri ("https" + ":" + "//www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip") -OutFile ffmpeg.zip

          Write-Host "Extracting FFmpeg..."
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extracted -Force

          Write-Host "Finding FFmpeg executables..."
          $ffmpeg = Get-ChildItem -Path ffmpeg-extracted -Filter ffmpeg.exe -Recurse | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path ffmpeg-extracted -Filter ffprobe.exe -Recurse | Select-Object -First 1

          if (-not $ffmpeg) {
            throw "ffmpeg.exe was not found."
          }

          if (-not $ffprobe) {
            throw "ffprobe.exe was not found."
          }

          Write-Host "Found FFmpeg: $($ffmpeg.FullName)"
          Write-Host "Found FFprobe: $($ffprobe.FullName)"

          New-Item -ItemType Directory -Force -Path "src-tauri/resources/ffmpeg" | Out-Null

          Copy-Item $ffmpeg.FullName "src-tauri/resources/ffmpeg/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "src-tauri/resources/ffmpeg/ffprobe.exe" -Force

          Write-Host "FFmpeg resources prepared."

      - name: Verify FFmpeg resources
        shell: pwsh
        run: |
          Write-Host "Checking bundled FFmpeg files..."
          Get-ChildItem "src-tauri/resources/ffmpeg"

          if (-not (Test-Path "src-tauri/resources/ffmpeg/ffmpeg.exe")) {
            throw "Bundled ffmpeg.exe is missing."
          }

          if (-not (Test-Path "src-tauri/resources/ffmpeg/ffprobe.exe")) {
            throw "Bundled ffprobe.exe is missing."
          }

      - name: Build Windows installer
        run: npm run tauri build

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: content-studio-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
